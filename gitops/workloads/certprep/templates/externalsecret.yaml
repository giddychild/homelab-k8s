{{- if .Values.externalSecret.enabled }}
# ESO pulls secret/certprep/app from the homelab Vault (cross-cluster AppRole,
# the same vault-backend ClusterSecretStore money and learnquest use).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.secretName }}
    creationPolicy: Owner
  data:
    # Signs session cookies. Rotating it signs everyone out; it does not
    # invalidate stored passwords.
    - secretKey: secret_key
      remoteRef: { key: {{ .Values.externalSecret.vaultPath }}, property: secret_key }
    {{- if .Values.cloudflare.tunnel.enabled }}
    - secretKey: cf_tunnel_token
      remoteRef: { key: {{ .Values.externalSecret.vaultPath }}, property: cf_tunnel_token }
    {{- end }}
{{- end }}
