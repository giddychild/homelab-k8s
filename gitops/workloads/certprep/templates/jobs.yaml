{{- if .Values.jobs.migrate.enabled }}
# Schema migration. Wave 5: after Postgres is Ready, before the API rolls.
# Alembic is idempotent, so this re-runs harmlessly on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "certprep.name" . }}-migrate
  labels: {{- include "certprep.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: {{ include "certprep.name" . }}-migrate }
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecret }}
      imagePullSecrets: [{ name: {{ . }} }]
      {{- end }}
      securityContext: {{- include "certprep.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env: {{- include "certprep.apiEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: {{- include "certprep.containerSecurity" . | nindent 12 }}
{{- end }}
{{- if .Values.jobs.import.enabled }}
{{- range $i, $pkg := .Values.jobs.import.packages }}
---
# Question bank import, one Job per certification. Wave 10: after the API is up.
# The banks ship inside the image, so this writes database rows only and reports
# every unchanged record as such — safe to re-run on every sync.
#
# Adding a certification means adding an entry to jobs.import.packages AND
# rebuilding the API image with its directory under data/source; the bank is
# baked in, not mounted.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "certprep.name" $ }}-import-{{ $pkg.package }}
  labels: {{- include "certprep.labels" $ | nindent 4 }}
  annotations:
    # Staggered so two imports never contend for the same taxonomy rows: each
    # sync_taxonomy call upserts domains by code, and concurrent runs against
    # one database would deadlock on it.
    argocd.argoproj.io/sync-wave: {{ add 10 $i | quote }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      # The shared label is what the CiliumNetworkPolicy allows to reach
      # Postgres; a per-package label would leave every new import blocked.
      labels: { app: {{ include "certprep.name" $ }}-import }
    spec:
      restartPolicy: Never
      {{- with $.Values.image.pullSecret }}
      imagePullSecrets: [{ name: {{ . }} }]
      {{- end }}
      securityContext: {{- include "certprep.podSecurity" $ | nindent 8 }}
      containers:
        - name: import
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.api.repository }}:{{ $.Values.image.api.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - python
            - -m
            - app.cli
            - import-bank
            - --package
            - {{ $pkg.package | quote }}
            - --cert-code
            - {{ $pkg.certCode | quote }}
            - --cert-name
            - {{ $pkg.certName | quote }}
            - --vendor
            - {{ $pkg.vendor | quote }}
            # Exhibits are baked into MEDIA_ROOT/<package>, so the importer
            # reads them from there and its copy step is a no-op.
            - --images-dir
            - /data/media/{{ $pkg.package }}
          env: {{- include "certprep.apiEnv" $ | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: {{- include "certprep.containerSecurity" $ | nindent 12 }}
{{- end }}
{{- end }}
