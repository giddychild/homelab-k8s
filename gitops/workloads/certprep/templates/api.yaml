apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certprep.name" . }}-api
  labels: {{- include "certprep.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: {{ include "certprep.name" . }}-api }
  template:
    metadata:
      labels:
        app: {{ include "certprep.name" . }}-api
        {{- include "certprep.labels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets: [{ name: {{ . }} }]
      {{- end }}
      securityContext: {{- include "certprep.podSecurity" . | nindent 8 }}
      # Spread replicas across nodes so a single node draining does not take
      # the API down mid-exam.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: {{ include "certprep.name" . }}-api }
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env: {{- include "certprep.apiEnv" . | nindent 12 }}
          # Liveness only checks the process; readiness also checks the
          # database, so a pod that cannot reach Postgres leaves the Service
          # rather than being restarted in a loop.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "certprep.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything that writes needs an
            # explicit writable mount.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "certprep.name" . }}-api
  labels: {{- include "certprep.labels" . | nindent 4 }}
spec:
  selector: { app: {{ include "certprep.name" . }}-api }
  ports: [{ name: http, port: {{ .Values.api.port }}, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "certprep.name" . }}-api
  labels: {{- include "certprep.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: {{ include "certprep.name" . }}-api }
