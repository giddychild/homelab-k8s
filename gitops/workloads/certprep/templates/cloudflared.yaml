{{- if .Values.cloudflare.tunnel.enabled }}
# Cloudflare Tunnel (remotely managed). cloudflared dials OUT to Cloudflare's
# edge — no inbound ports, home IP hidden. The public hostname route
# ({{ .Values.cloudflare.publicHost }} -> the nginx ingress over HTTPS/443) is
# configured in the Zero Trust dashboard; this Deployment only needs the token.
#
# The route MUST target the ingress on HTTPS/443, not http/80: the Ingress
# force-redirects HTTP to HTTPS, so an http origin makes cloudflared take a 308
# on every request and the app never loads. Set HTTP Host Header and TLS Origin
# Server Name to {{ .Values.ingress.host }} so the ingress routes by host and
# TLS validates against the Let's Encrypt certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certprep.name" . }}-cloudflared
  labels: {{- include "certprep.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cloudflare.tunnel.replicas | default 2 }}
  selector:
    matchLabels: { app: {{ include "certprep.name" . }}-cloudflared }
  template:
    metadata:
      labels: { app: {{ include "certprep.name" . }}-cloudflared }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflare.tunnel.image }}"
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.secretName }}
                  key: cf_tunnel_token
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
