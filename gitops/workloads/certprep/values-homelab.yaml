# apps-prod overrides for CertPrep.
image:
  api: { tag: "0.4.0" }
  web: { tag: "0.4.0" }

api:
  replicas: 2
web:
  replicas: 2

postgres:
  instances: 2
  storage:
    size: 5Gi
    storageClass: longhorn-r2   # 2 replicas; matches money/learnquest

ingress:
  enabled: true
  host: certprep.apps.giddyland.net

# Public access at certprep.giddyland.net. Requires the tunnel token in Vault
# at secret/certprep/app (key cf_tunnel_token) — ESO will not materialize
# certprep-secrets without it, and cloudflared will not start.
# See docs/runbooks/certprep-cloudflare-tunnel.md.
cloudflare:
  publicHost: certprep.giddyland.net
  tunnel:
    enabled: true

externalSecret:
  enabled: true
  vaultPath: certprep/app
