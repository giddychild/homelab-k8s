# Default values for CertPrep. Overridden by values-homelab.yaml for apps-prod.
#
# CertPrep is a two-service app: a Next.js frontend that proxies /api to a
# FastAPI backend, over CNPG Postgres and a small Redis. The 606-question bank
# and its 915 exhibit images are baked into the API image, so the API is
# stateless and needs no PVC — the bank is versioned content, released with the
# code. Conventions mirror learnquest/money (ESO from Vault, ghcr-pull,
# Cloudflare Tunnel for public access).
nameOverride: ""

image:
  registry: ghcr.io/giddychild
  api:
    repository: certprep-api
    tag: "0.1.0"
  web:
    repository: certprep-web
    tag: "0.1.0"
  pullPolicy: IfNotPresent
  pullSecret: ghcr-pull

api:
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

web:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: "500m", memory: 512Mi }

# Mock exam defaults. These are also editable per-blueprint in the database;
# these values only seed the default blueprint on first import.
exam:
  questions: 70
  minutes: 100

# Non-secret environment passed to the API.
env: {}

postgres:
  instances: 2
  # NOTE: enabling backup.barman below ALSO requires switching this to the
  # "-system-bookworm" variant — the standard image has no barman-cloud-backup
  # binary and CNPG fails the archive command with "not found". money hit this.
  image: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 5Gi
    storageClass: longhorn-r2   # 2 replicas; matches money/learnquest
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

  backup:
    # A nightly pg_dump to its own PVC. On by default because it needs nothing
    # external and the alternative is no backup at all. What it protects: a
    # dropped table, a bad migration, a deleted Cluster. What it does not: loss
    # of Longhorn or of the cluster, since the dumps sit on the same storage.
    dump:
      enabled: true
      schedule: "20 3 * * *"      # 03:20 daily, standard 5-field cron
      keepDays: 14
      size: 2Gi
      storageClass: longhorn-r2
    # CNPG base backups + WAL archiving to S3 — real off-site, point-in-time
    # recovery. Enable only after creating a DEDICATED bucket and a scoped IAM
    # user and writing the keys to Vault; see the runbook. Do not reuse the
    # Velero bucket root — that breaks Velero's BackupStorageLocation.
    barman:
      enabled: false
      destinationPath: "s3://giddyland-certprep-pg-backups/"
      endpointURL: "https://s3.us-east-1.amazonaws.com"
      vaultPath: "certprep/backup-s3"
      serverName: "certprep-pg"
      schedule: "0 40 3 * * *"    # CNPG cron is 6-field: 03:40 daily
      retention: "30d"

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: "250m", memory: 128Mi }

# Runs `alembic upgrade head` before the API starts (sync-wave 5), and the bank
# import after (sync-wave 10). Both are idempotent, so they re-run safely on
# every sync.
jobs:
  migrate:
    enabled: true
  import:
    enabled: true
    # One entry per certification, each producing its own import Job on a
    # successive sync wave. `package` is the directory name under data/source
    # in the API image — the bank is baked in, so adding an entry here also
    # means rebuilding and bumping image.api.tag.
    packages:
      - package: az104
        certCode: "AZ-104"
        certName: "Microsoft Azure Administrator"
        vendor: "Microsoft"

ingress:
  enabled: true
  className: nginx
  host: certprep.apps.giddyland.net
  clusterIssuer: letsencrypt-prod
  tls: true

# Public exposure via Cloudflare Tunnel (cloudflared dials out; no inbound
# ports). Configure the public hostname route in the Zero Trust dashboard —
# see docs/runbooks/certprep-cloudflare-tunnel.md. Enabled in
# values-homelab.yaml; the token comes from Vault (key cf_tunnel_token).
cloudflare:
  publicHost: certprep.giddyland.net
  tunnel:
    enabled: false
    image: cloudflare/cloudflared:2026.5.2
    replicas: 2

externalSecret:
  enabled: true
  storeRef: vault-backend            # ClusterSecretStore (cross-cluster AppRole)
  vaultPath: certprep/app            # secret/certprep/app
  secretName: certprep-secrets

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false
