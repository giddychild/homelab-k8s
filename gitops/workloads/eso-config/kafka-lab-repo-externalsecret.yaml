# ExternalSecret — ArgoCD repository credentials for the private GitLab repo
# gitlab.com/kafka694143/kafka-lab. The GitLab *deploy token* (read_repository
# only) lives in Vault secret/kafka-lab-repo {username, password}; ESO renders it
# as an ArgoCD repository Secret (label argocd.argoproj.io/secret-type=repository).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-kafka-lab
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: repo-kafka-lab
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        name: kafka-lab
        url: https://gitlab.com/kafka694143/kafka-lab.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: kafka-lab-repo
        property: username
    - secretKey: password
      remoteRef:
        key: kafka-lab-repo
        property: password
