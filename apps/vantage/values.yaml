# Vantage — homelab (apps-prod) values.
# Matches the Custodia deployment pattern: bundled Postgres StatefulSet (no CNPG
# operator in this cluster), Redis, GHCR images, ESO-materialised secrets,
# nginx ingress + cert-manager, per-app Cloudflare Tunnel.

nameOverride: ""
namespace: vantage-prod

image:
  registry: ghcr.io/giddychild
  tag: "0.27.0"            # bumped by `make bump`; pinned by digest in prod-values
  pullPolicy: IfNotPresent
  pullSecrets: [ghcr-creds]

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  env:
    LOG_LEVEL: INFO
    LOG_FORMAT: json

web:
  replicas: 2
  resources:
    requests: { cpu: 50m,  memory: 192Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# One Deployment per worker role so a discovery outage cannot starve generation.
workers:
  discovery: { replicas: 1, resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } } }
  enrich:    { replicas: 2, resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { cpu: "2", memory: 2Gi } } }
  generate:  { replicas: 2, resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { cpu: "2", memory: 2Gi } } }
  # There IS a submit worker now. Decision C3 said nothing here submits at all;
  # that was reversed deliberately, asked for repeatedly after the risks were
  # laid out in full (see docs/00-decisions-and-pushback.md C3a).
  #
  # ONE replica, and that is a design decision rather than a resource one. Two
  # pods would apply to two jobs at once from the same address, which is both
  # the behaviour a rate limiter notices and a good way to submit twice to one
  # employer despite the cooldown.
  #
  # The reasoning that made a datacentre browser a bad idea does not apply
  # here: this cluster egresses through the house's own connection, so the
  # applications come from a residential address rather than an AWS range. That
  # is most of why this is worth doing at all.
  #
  # Memory is generous because Chromium is. A 1Gi limit OOM-kills mid-form,
  # which reads as a mysterious failure rather than as running out of memory.
  submit:    { replicas: 1, resources: { requests: { cpu: 250m, memory: 1Gi },  limits: { cpu: "2", memory: 3Gi } } }

postgres:
  enabled: true                       # ADR-005: no CNPG operator in this cluster
  image: pgvector/pgvector:pg16
  storage:
    className: longhorn
    # 3 replicas x this size must fit, and Longhorn keeps a ~30% per-disk
    # reserve. 20Gi failed with ReplicaSchedulingFailure on this cluster.
    # Longhorn volumes expand in place, so start small and grow when needed:
    # ~100k jobs with 768-dim embeddings is well under 2Gi.
    size: 8Gi
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 4Gi }
  # secret `vantage-db-app` is created OUT OF BAND with kubectl (never in git —
  # homelab-k8s is a PUBLIC repo). Keys: `password` (StatefulSet), `uri` (app).
  existingSecret: vantage-db-app

redis:
  enabled: true
  image: redis:7-alpine
  storage: { className: longhorn, size: 2Gi }
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

objectStore:
  enabled: true
  # In-namespace, not a shared `minio` namespace. This previously pointed at
  # minio.minio.svc.cluster.local, where nothing was ever deployed — the app was
  # configured against a service that did not exist, and it went unnoticed
  # because no code path had exercised it yet.
  # The endpoint is derived in the ConfigMap from the release name; there is no
  # hostname to keep in sync by hand.
  image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
  mcImage: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
  bucket: vantage
  region: us-east-1
  storage:
    className: longhorn
    # Resumes and generated documents: a few hundred KB each, for a household.
    # Longhorn volumes expand in place, so start small.
    size: 5Gi
  resources:
    requests: { cpu: 50m,  memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  # access keys via ESO → vantage-secrets (BLOB_ACCESS_KEY / BLOB_SECRET_KEY).
  # MinIO reads the same two values as its root credentials.

# Occupation taxonomy: O*NET (~900 US occupations, every sector). Seeded once by
# a Job; makes the system usable by a nurse or a teacher, not just an engineer.
taxonomy:
  source: onet
  seedVersion: "29.0"
  ladders: [software_ic, us_federal_gs, rn_clinical, k12_teaching, trades]

ai:
  local:
    baseUrl: http://ollama.ai-ops.svc.cluster.local:11434
    extractModel: qwen2.5:7b-instruct
    embedModel: nomic-embed-text
    embedDim: 768
  frontier:
    enabled: true
    provider: anthropic
    model: claude-opus-5
    # api key via ESO → vantage-secrets key `anthropic_api_key`
    monthlyBudgetUSD: 25          # per person
  redactionProxy: true                # PII tokenised before leaving the cluster

ingress:
  enabled: true
  className: nginx
  # Single hostname, matching every other app on this cluster.
  #
  # Do NOT create an A record for this host. Cloudflare creates a Type=Tunnel
  # record automatically when the tunnel route is added — that is how custodia,
  # money, learn, care, deuce and recall all work.
  #
  # The cert is issued by cert-manager over ACME **DNS-01** (Cloudflare API
  # token), not HTTP-01, so it works fine behind the orange cloud and needs no
  # inbound reachability.
  host: vantage.giddyland.net
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  tls: true

# Public exposure. Route in the Cloudflare dashboard points at
# ingress-nginx-controller.ingress-nginx.svc.cluster.local:443 with
# Origin-Server-Name + Host header = vantage.giddyland.net.
cloudflare:
  tunnel:
    enabled: true                     # token in the vantage-tunnel-token Secret (kubectl, never git)
    image: cloudflare/cloudflared:2026.5.2
    replicas: 2
    tokenSecret: vantage-tunnel-token

# Cloudflare Access is the identity provider — the same one-time-email-PIN
# flow used for money.giddyland.net. No client secret, no application to
# register: validation uses Cloudflare's public keys.
auth:
  access:
    enabled: true
    teamDomain: giddyland.cloudflareaccess.com
    # Application AUD tag. Not a secret — it appears in the public login
    # redirect. Changes if the Access application is deleted and recreated.
    aud: 231eac805f719922f1b40b6b9d04782aef53047350b14478e4c5766d0f64d60c

externalSecrets:
  # Vault paths written and verified; ESO now owns `vantage-secrets` and adopts
  # the hand-made Secret in place (creationPolicy: Owner).
  #
  # Every key listed below MUST exist in Vault, even as an empty string — ESO
  # fails the entire ExternalSecret on one missing key, so the Secret is never
  # created and no pod starts. Same footgun as LearnQuest's cf_tunnel_token.
  enabled: true
  storeRef: vault-backend             # existing ClusterSecretStore, verified Ready
  # Vault KV paths → k8s Secret `vantage-secrets`
  #   secret/vantage/app     : anthropic_api_key, column_encryption_key,
  #                            jwt_secret        (no oidc_client_secret —
  #                            Cloudflare Access needs no client secret)
  #   secret/vantage/blob    : minio_access_key, minio_secret_key
  #   secret/vantage/notify  : discord_webhook_url, smtp_url, ntfy_topic
  #   secret/vantage/sources : greenhouse_key, lever_key, ashby_key,
  #                            smartrecruiters_key, usajobs_key, adzuna_key
  #   secret/vantage/mailbox : imap_url, imap_user, imap_password

# Per-person defaults, written into `settings` on first login.
#
# There ARE auto-apply knobs now (auto_apply, auto_submit, auto_apply_floor),
# added in migration 0016 and defaulting to off per account. They are not
# defaulted here on purpose: a chart value that switched automatic applying on
# for everybody at once is exactly the setting that should require a person to
# find it and turn it on themselves.
#
# The finding behind the old comment still stands and still matters: no major
# ATS grants an outside applicant permission to submit programmatically. So the
# cap and the cooldown below are not decoration — they are what keeps this
# looking like a person applying, which it is.
settings:
  shortlistFloor: 0.60
  dailyPrepareCap: 10
  perCompanyCooldownDays: 30
  packageExpiryHours: 72
  ghostAfterDays: 45
  currency: USD

cron:
  # suspend defaults to true in the template. These two are unsuspended
  # because `app.cron` now implements them; the other three still run
  # against tasks that do not exist and must stay suspended until they do.
  discovery:  { schedule: "0 */6 * * *", suspend: false }
  rescore:    { schedule: "30 2 * * *", suspend: false }
  # Safe to leave running: `settings.auto_apply` defaults to false, so this
  # tops up nobody's queue until somebody turns the switch on themselves.
  autoApply:  { schedule: "15 */2 * * *", suspend: false }
  # Offset from autoApply so packages have time to generate before the browser
  # goes looking for them. Same safety: does nothing while auto_apply is false,
  # and submits nothing while auto_submit is false.
  autoSubmit: { schedule: "45 */2 * * *", suspend: false }
  ghostSweep: { schedule: "0 3 * * *" }
  dailyDigest: { schedule: "0 7 * * *" }
  weeklyReport: { schedule: "0 8 * * 1" }
  pgDump:     { schedule: "30 2 * * *", retentionDays: 30 }

networkPolicy:
  enabled: true
  # Default deny + explicit allows. Workers reach the internet on 443 only, to
  # this FQDN allowlist. Adding a connector means adding its host here.
  egressAllowFQDN:
    # direct ATS (discovery only — these APIs are read-only for applicants)
    - boards-api.greenhouse.io
    - api.lever.co
    - api.ashbyhq.com
    - api.smartrecruiters.com
    - apply.workable.com
    # remote-first boards
    - himalayas.app
    - remotive.com
    # government — every occupation, not just technical
    - data.usajobs.gov
    - api.careeronestop.org
    # AI
    - api.anthropic.com

monitoring:
  serviceMonitor: true
  prometheusRules: true
  grafanaDashboard: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

podDisruptionBudget:
  enabled: true
  minAvailable: 1
