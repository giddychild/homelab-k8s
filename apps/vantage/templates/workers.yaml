{{- range $role, $cfg := .Values.workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vantage.fullname" $ }}-worker-{{ $role }}
  labels: {{- include "vantage.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    vantage.io/queue: {{ $role }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels: {{- include "vantage.selectorLabels" $ | nindent 6 }}
      vantage.io/queue: {{ $role }}
  template:
    metadata:
      # Roll when the ConfigMap changes. Without this a config edit lands in the
      # ConfigMap and the running pods keep the old values indefinitely, because
      # envFrom is resolved once at pod start. That is exactly how these workers
      # kept pointing at a MinIO endpoint that had been changed hours earlier
      # while the API — which already had this annotation — picked it up.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels: {{- include "vantage.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        vantage.io/queue: {{ $role }}
    spec:
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if eq $role "submit" }}
      # uid 1000 is the Playwright base image's `pwuser`, which owns the
      # browser install and its cache. Forcing the other images' 10001 here
      # gives a Chromium that cannot read its own binaries.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- else }}
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          # The submit role runs a different image because it carries Chromium.
          # Same `app` package and same WorkerSettings — only the browser and
          # its ~700 MB of system libraries differ, which discovery, enrich and
          # generate would otherwise pull on every restart.
          image: "{{ $.Values.image.registry }}/vantage-{{ if eq $role "submit" }}submit{{ else }}worker{{ end }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $role "submit" }}
          # Chromium's own sandbox needs to create user namespaces, which
          # `allowPrivilegeEscalation: false` plus a dropped capability set
          # forbids. Rather than granting SYS_ADMIN back, the browser is run
          # with --no-sandbox inside a container that is itself the sandbox:
          # non-root, read-only root filesystem, no service-account token, and
          # egress confined by NetworkPolicy. It also runs as the base image's
          # pwuser, which owns the browser cache the profile is written to.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          {{- else }}
          securityContext: {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef: { name: {{ include "vantage.fullname" $ }}-config }
            - secretRef:    { name: vantage-secrets }
          env:
            - name: QUEUE
              value: {{ $role | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ $.Values.postgres.existingSecret }}, key: uri }
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef: { name: {{ $.Values.postgres.existingSecret }}, key: admin_uri }
            - name: REDIS_URL
              value: "redis://{{ include "vantage.fullname" $ }}-redis:6379/0"
          resources: {{- toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Chromium needs a writable profile under a read-only rootfs. The
            # path differs by image: the submit image is built on Microsoft's
            # Playwright base and runs as its `pwuser`, so mounting the other
            # image's /home/vantage/.cache there leaves the browser writing to
            # a read-only home and failing to launch.
            - { name: browser, mountPath: /home/{{ if eq $role "submit" }}pwuser{{ else }}vantage{{ end }}/.cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
        - name: browser
          emptyDir: { sizeLimit: 1Gi }
{{- end }}
