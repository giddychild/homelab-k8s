{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vantage.fullname" . }}-db
  labels: {{- include "vantage.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  serviceName: {{ include "vantage.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels: {{- include "vantage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels: {{- include "vantage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: vantage
            - name: POSTGRES_USER
              value: vantage_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            # tuned for a single HDD-backed Longhorn volume
            - -c
            - shared_buffers=512MB
            - -c
            - work_mem=32MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - effective_io_concurrency=1
            - -c
            - random_page_cost=4.0
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "vantage_app", "-d", "vantage"] }
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storage.className }}
        resources: { requests: { storage: {{ .Values.postgres.storage.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vantage.fullname" . }}-db
spec:
  selector: {{- include "vantage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: db
  ports: [{ name: pg, port: 5432, targetPort: pg }]
{{- end }}

{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vantage.fullname" . }}-redis
  labels: {{- include "vantage.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "vantage.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels: {{- include "vantage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels: {{- include "vantage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          # AOF: queued work and dead letters must survive a restart
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storage.className }}
        resources: { requests: { storage: {{ .Values.redis.storage.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vantage.fullname" . }}-redis
spec:
  selector: {{- include "vantage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- end }}
