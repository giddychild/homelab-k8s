apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vantage.fullname" . }}-api
  labels: {{- include "vantage.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "vantage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "vantage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # Migrations run here, advisory-locked, so two replicas cannot race.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.registry }}/vantage-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef: { name: {{ include "vantage.fullname" . }}-config }
            - secretRef:    { name: vantage-secrets }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: uri }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }

      containers:
        - name: api
          image: "{{ .Values.image.registry }}/vantage-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: {{ include "vantage.fullname" . }}-config }
            - secretRef:    { name: vantage-secrets }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: uri }
            - name: REDIS_URL
              value: "redis://{{ include "vantage.fullname" . }}-redis:6379/0"
            {{- range $k, $v := .Values.api.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }

      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vantage.fullname" . }}-api
  labels: {{- include "vantage.labels" . | nindent 4 }}
spec:
  selector: {{- include "vantage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vantage.fullname" . }}-api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "vantage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
